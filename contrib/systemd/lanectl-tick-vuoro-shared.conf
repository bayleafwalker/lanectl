# Install for a workstation with both repository-scoped Vuoro Shared bindings.
[Service]
LoadCredential=lanectl-homelab-analytics:%h/.config/vuoro/credentials/lanectl-homelab-analytics.token
LoadCredential=lanectl-vuoro-cloud:%h/.config/vuoro/credentials/lanectl-vuoro-cloud.token
Environment=SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
