id = "s3-deploy-reap"
repo = "lanectl"
base_sha = "bf9a3dfe3feb29aaef6ea5de045fc8f08a089bfd"
revision = 3
title = "deploy list and reap; doctor warns on expired live deploys"
task_class = "tooling"
size = "S"
data_class = "public"

outcome = """
Plan docs/plans/2026-11-10-stage3-gate-jobs-and-train-deploys.md, release s3-deploy-reap.
src/lanectl/deploy.py (from s3-train-deploy) has live(events), teardown(log, train_id, reason) and
the "deploy" plugin command with "run" and "down". Dev deploys carry expires_at; nothing removes
them when it passes.

Add to src/lanectl/deploy.py:
- due(events, now) -> list of (train_id, reason) for live deploys, in train.deployed order, where
  reason is "landed" when an item.landed event names that train_id, else "superseded" when a later
  passed train.deployed exists for the same repo, else "expired" when expires_at <= now; live
  deploys with none of these are not listed.
- reap(log, now=None) -> list[str]: tears down every due deploy with its reason (teardown) and
  returns one line per teardown.
- "deploy list [--json]": one line per live deploy:
  "<namespace>  <train_id>  <repo>  expires <expires_at>" with "  EXPIRED" appended when past;
  --json prints a list of {"train_id", "namespace", "repo", "expires_at", "expired"}.
  With no live deploys print "no live deploys".
- "deploy reap": runs reap and prints its lines (or "nothing to reap"); exit 0.

Fix "deploy run <train_id>": exit 0 only when the last train.deployed event for that train_id
passed (today any earlier passed deploy of the train makes a failed rerun exit 0).

In src/lanectl/doctor.py add a "deploys" check to run(): WARN with detail
"<n> live past expires_at (lanectl deploy reap)" when any live deploy has expired at `now`,
otherwise no finding.
"""

[scope]
paths = ["src/lanectl/deploy.py", "src/lanectl/doctor.py", "tests/stage8/**"]

[acceptance]
files = ["tests/stage8/test_acc_deploy_reap.py"]
exec = ["uv run --no-sync pytest -q -p no:cacheprovider tests/stage8/test_acc_deploy_reap.py"]
