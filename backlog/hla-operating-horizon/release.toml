id = "hla-operating-horizon"
repo = "homelab-analytics"
base_sha = "b3fb3d750e561eabde492ebe9812fb50849c0e04"
revision = 3
title = "Merge dated household actions in the seven-day operating horizon"
task_class = "product-ui"
size = "M"
data_class = "public"
eligible_lanes = ["implement"]
work = "homelab-analytics#1592"
work_complete = true

outcome = """
Provide an authenticated, read-only GET /control/operating-horizon feed for the Operating Picture seven-day
horizon. Reuse reporting marts for upcoming fixed costs and contract renewals,
the existing source freshness views for due manual exports, and the existing
proposal store for pending approvals. Preserve the underlying endpoints and
authorization boundaries. Return a stable kind, date and display label per row
and enough identity to keep distinct same-day actions. Sort by date with
deterministic ties. Include today through today plus six days. Show unresolved
pending approvals today as actionable now, without calling that date a deadline.
Return the API date boundary as start_date (YYYY-MM-DD), even when rows is
empty. The page uses that date for all seven cells and does not recompute
its own boundary. Omit resolved proposals, automatic pulls,
undated exports, and dated rows outside the horizon. Preserve empty days and
report an unavailable feed distinctly from an empty feed. Display each kind and
show every same-day action, including existing amounts and currencies where
present. Keep this feed read-only. The view accepts ordered horizon days as
{dateLabel, items}, where items retain the API row fields. Expose the merged
feed error to the view as unavailable.operatingHorizon.

Reuse the completed revision-two implementation as the starting point. The
isolated clone can read the candidate objects by SHA. Inspect and apply the
implementation-only diff with:
git diff --binary 0f8c3161640463d7bc06bdc02c64e8cf403dd278 4805bbf6866aacc7093f5b2813ffef8ed215e6f7 | git apply
This diff excludes the older frozen acceptance files. Preserve the new frozen
inputs and run the prescribed checks. The retry corrects planner-owned lint
and independently checks one-clock export evaluation.

Acceptance exercises the HTTP surface with all four real source kinds, same-day
ties, out-of-window rows, automatic pulls and resolved proposals, then verifies
the Operating Picture consumer renders the feed and each kind. Exercise the
access boundary and empty response. Fail on the base for the missing feed.
"""

[scope]
paths = ["apps/api/**", "apps/web/frontend/**", "packages/application/**", "packages/pipelines/reporting_service.py", "tests/**"]

[acceptance]
files = ["tests/test_operating_horizon_acceptance.py", "apps/web/frontend/unit/operating-horizon-acceptance.test.cjs"]
exec = ["uv run --no-sync python -m pytest -q -p no:cacheprovider tests/test_operating_horizon_acceptance.py"]
fail_on_base = true
