title = "Consistent overview priority across readers and screens"
outcome = "# Consistent priority for the existing overview attention publication\n\nThe existing overview producer and schema define 3 as high, 2 as medium and 1 as low. Fix the contradictory ordering and presentation of that same publication. Do not introduce a new scoring model or source of attention.\n\nAt base `82dbd9477029d6fda7df67edc617f45a1a4ceb59`, warehouse and published current reads return opposite priority orders; Operating Picture, Home and First Answer put low priorities first, and several screens label 1 as urgent. Other consumers use raw numeric maxima or descending sorts that promote an unknown value above valid priorities. This correction must cover the connected readers and consumers below.\n\n## Read contract\n\nApply one production-used canonical overview ordering rule after retrieval in warehouse, published and prefer-published modes, including fallback, and after attention-only historical projection. Known priorities order 3, 2, 1; unknown, absent and out-of-range priorities sort last and remain visible. Do not treat booleans or strings as a recognized priority. Within a priority, compare `item_type`, `title`, `item_id`, `detail`, then `source_domain` deterministically, using code-point string order with null/missing values after present strings. Preserve every row and its original values, including exact duplicates and multiple rows with the same item ID. Sorting must not modify the input rows or stored publications.\n\nPreserve immutable snapshot bytes, snapshot identity and metadata, incompatible-column projection information and the distinction between current, snapshot and no history. A missing snapshot remains empty `no_history`; it must not fall back to current rows. Preserve existing authentication, publication permissions and denial behavior. Do not change producer scores, domain association, IDs, report schemas or API field shapes.\n\n## Consumers\n\nOperating Picture, Home, First Answer, Ingest Summary, Review and console must agree with canonical priority and tie order, including before list truncation. Remove or replace local sorts that invert the canonical result. Existing high-first behavior remains high-first. Operating Picture uses 3 urgent, 2 soon and 1 watch. Preserve console's valid S1/S2/S3 convention with 3 mapped to S1. Unknown priorities are neutral and explicitly unranked, never silently low, highest, failed or urgent. Preserve useful layout, accessible text, links, and non-priority functionality.\n\nHome's historical presentation must preserve the complete canonical order and retain neutral, visible unknown rows. Wallboard retains its existing warning threshold for valid priority 2 or 3, but unknown values must not create an urgent warning. The real briefing composer preserves its valid warning/notice/info convention while using canonical order and ties and neutral handling of unknown priority. The assistant headline and its evidence must name the same highest valid priority; raw `max` must not make an unknown value highest. Keep existing empty-data and unavailable-data truthfulness.\n\nDo not change the separate individual-record identity API, its routes, encoding, grouping, authorization or existing tests. This publication correction benefits the broad ranked-urgency requirement in HLA1593, but does not adopt its exhausted individual-record source, complete its UI outcome or reset its attempts. It also does not complete or narrow HLA1590: that item still requires a metric, comparable trend and own attention per active loaded source-owning domain, with truthful empty states. Its membership decision and zero implementation attempts remain unchanged.\n\n## Scope and verification\n\nUse a small production-used overview ordering helper and a shared frontend priority helper if needed. Allowed source areas are the overview reader, the reporting service and attention-only report projection, the listed consumer pages/components, the briefing composer and assistant overview handling. Preserve producer logic, migrations, dependencies, locks, CSS and existing visual baselines. Correct an inconsistent story fixture only to match the established producer scale; count every change. Update narrowly relevant documentation. If new metadata would regenerate contracts, count every generated line and preserve schemas.\n\nAdd meaningful ordinary tests for any new helper and its production wiring. Cover known/unknown priorities, ties, duplicate preservation, unchanged inputs and consumer conventions. A Python wrapper must actually run any new Node tests and fail rather than skip when unavailable. Worker tests, wrappers, documentation and generated files all count toward M700: additions plus deletions, with at most two actual implementation attempts across this original correction. Do not edit the protected independent acceptance or existing individual-record tests, visual checks, snapshots or tolerances. No gate omission, attempt reset, class relabelling or unsupported-facet substitute is permitted.\n\nThe independent first-party gate uses real PostgreSQL publication, warehouse and prefer modes, real HTTP and permissions, actual Next/browser consumers, the real briefing composer, source-value/multiset guards and immutable snapshots. Its ordinary CLI and pytest paths must retain the full named population and distinguish actual priority assertions from infrastructure or precondition failures. Missing helpers, missing tools, build failures, unavailable APIs or browsers, wrong permissions and cleanup failures are not semantic base-red evidence. Candidate green remains unobserved until an actual implementation exists.\n\nAfter candidate acceptance, require the complete `make verify-fast`, all 55 unchanged visual checks and baseline tolerances, architecture checks, seven selected native specialist reviews, product-intention pass, normal train and dev health, PR with every CI check, and exact canonical adoption. The integrator's current policy remains revision 1: this packet grants no model-error repair permission and activates no policy draft. Record the original failed attempts and rulings if implementation fails.\n\nSource inspection suggests a full correction can plausibly fit M700 using shared helpers: approximately 150\u2013230 source lines, 220\u2013350 test/wrapper lines and 10\u201325 documentation lines. These are additions plus deletions and are estimates, not a measured candidate or a budget waiver. Return a real boundary if the complete outcome cannot fit; do not reduce coverage to obtain a passing result.\n"
task_class = "product-ui"
