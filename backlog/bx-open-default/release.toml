id = "bx-open-default"
repo = "lanectl"
base_sha = "78be49fb5702c7611deb402c90c705732e2dcbc7"
revision = 1
title = "status and ready show open work by default"
task_class = "glue"
size = "S"
data_class = "public"
outcome = """
Plan docs/plans/2026-11-10-backlog-dx-and-admin-views.md, wave 1. status prints every landed item
and ready reports landed releases as READY, burying open work. In src/lanectl/cli.py:
- status: by default omit items whose state is "landed" and print a line
  "landed: <n> (lanectl status --all to list)" after the item lines; --all prints every item as
  today. The metrics JSON stays.
- ready: by default skip a release whose item is landed at a published revision >= the release's
  revision (a reissued revision is shown again); --all includes them, printed with the status word
  LANDED in the column where READY/BLOCKED appears.
Use events.project_items for item state and published revision.
"""
[scope]
paths = ["src/lanectl/cli.py", "tests/stage8/**"]
[acceptance]
exec = ["uv run --no-sync pytest -q -p no:cacheprovider"]
files = ["tests/stage8/test_acc_open_default.py"]
