outcome = "Implement the complete four-kind HTTP adapter layer over canonical homelab-analytics source commit 30c0caf6c78d257ff5db79f42cca0b56a0f934b9. The existing ReportingService.get_attention_record and public AttentionRecordNotFoundError and AttentionRecordUnavailableError are the source contract; use them without reimplementing source queries, identities, authority or SQL in HTTP. Preserve source reader, reporting service and apps/api/routes/report_routes.py unchanged. This is an API prerequisite: meaningful ranked individual UI, independent review, full verify-fast, real train/dev, canonical CI and merge remain required; HLA1593 remains open.\n\nProvide all four GET /reports/{own-source-segment}/records/{item_id} endpoints under transaction-anomalies, contract-review-candidates, contract-renewal-watchlist and upcoming-fixed-costs. Use each existing source segment's authorization: attention-only permission does not grant source details, and denied requests must not leak data via another path. Resolve the entire opaque attention ID, including encoded slashes, without splitting, guessing or accepting an equal-looking first row. Return exactly item_id and all matching rows with the correct existing Pydantic public source row models. Respect the current source publication and existing PUBLISHED authority: never substitute warehouse data for an unavailable publication, and do not use historical fallback.\n\nMap provable unknown keys to 404 and unavailable source/identity to 503, with safe detail-only errors containing no stored fields or driver markers. Preserve valid matching groups despite unrelated NULLs; NULL or empty identity must not fabricate keys. Missing legacy charge_id columns make both known and plausible unknown keys unavailable without warehouse reads; an empty charge_id must never resolve a forged upcoming__date as 200. Nonempty literal None in a legitimate opaque ID remains valid. Preserve the established WarehouseBusyError 503 with Retry-After and retry_after_seconds, while unrelated programming errors remain server errors and are not sanitized into availability responses. Generate OpenAPI and TypeScript contracts for all four endpoints; no frontend behavior, auth policy, grants, migrations or dependencies change.\n\nPlace new route implementation in apps/api/routes/attention_record_routes.py and minimal registration in apps/api/app.py. Do not grow the existing report_routes.py godfile. Do not modify source-reader internals or recreate their SQL in HTTP. The worker owns HTTP regression tests against the actual current public contract and real lower warehouse lease/acquisition boundary, including synthetic driver failure, Busy and programming error behavior; do not patch the removed attention_records.run_on_warehouse name. A past prototype is planning evidence only, not an approved implementation. Keep original frozen tests/test_attention_record_api.py byte-for-byte unchanged; its original four kinds and source-query observer remain mandatory. No skipped tests, suppressions, narrowed kinds, weakened assertions or cap waiver.\n\nBefore acceptance run a real Docker/temporary PostgreSQL availability and connectivity preflight and execute all three declared acceptance commands with no skips. The first two original commands are unchanged; the third invokes the planner-owned stdlib PostgreSQL gate, which requires all three exact frozen integration-and-slow cases to execute successfully with zero skips, failures or errors, and rejects missing, malformed or incomplete JUnit evidence. The gate includes an integration-marked pytest wrapper for official per-file base checks; importing or collecting it does not run PostgreSQL, while executing it under the default not-slow selection runs the mandatory real PostgreSQL gate. The gate is first-party gpt-6.1-terra planner augmentation after the actual independent review requested revision; it is not a worker HTTP regression or reclassification. Use actual imports from the candidate checkout, not an editable canonical checkout. Independently qualify current source compatibility and HTTP regressions; preserve cleanup evidence. The integration owner separately runs full verify-fast, independent review, train/dev and CI. Keep formatted worker additions plus deletions at or below M700, including generated OpenAPI/TypeScript and worker regression tests, excluding the already-frozen planner acceptance input. A planning overlay measured 460 generated and 72 regression lines within 589 total additions; the actual worker diff decides fit. Do not change cap, reclassify source work, omit required artifacts, fragment kinds or waive checks to fit. If the complete contract does not fit, report the measured blocker.\n\nAcceptance author gpt-6.1-terra authored the unchanged frozen input; this scope and outcome revision is first-party GPT-6 planning. It requires a fresh independent native GoPro review before publication; do not infer or manufacture a verdict. The acceptance author and reviewer must differ, and the acceptance author cannot implement; the reviewer may implement when otherwise eligible. No provider invocation or publication is authorized by this draft."
