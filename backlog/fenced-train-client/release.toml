id = "fenced-train-client"
repo = "lanectl"
base_sha = "49f0c4bd72816e885d5e119fe194c8f190bb62d4"
revision = 8
title = "Execute ownership-compatible train checks through the separate-UID service"
task_class = "recovery"
size = "S"
data_class = "public"
eligible_lanes = ["implement"]

outcome = """
Repair the final independently reproduced cancellation gap in the public fenced
client. Base A6 already passed frozen and full-suite gates and matches its
independently reviewed source snapshot exactly. Its queued-start wait requires
both terminal state and receipt until the full deadline. Linked train/historical
worktree staging, source inspection, receipt authority and no-fallback behavior
are already covered. Do not rewrite those parts.

The integrator forced the independent review's stop advisory into its failure
case: _stop_terminal ignores a nonzero systemctl stop result, TimeoutExpired or
OSError, then accepts an inactive reading. An inactive unit may still have a
queued start, so without a successful stop acknowledgement the queue cancellation
is not proven. Returning true lets outer code remove the directory despite that
uncertainty. The frozen synthetic tests reproduce all three failed-stop forms
safely; the acknowledged-stop positive control already passes on this base.

Require successful completion of the exact systemctl stop command before treating
terminal state as proof of cancellation. A refused, unavailable or timed-out stop
must return false conservatively, so existing run_command callers retain and name
the orphan rather than clean it up. After acknowledged stop, retain existing
bounded terminal observation. Do not add repeated stop side effects, fallback
execution, reduced stop limits or new privileges. It is acceptable to retain an
orphan unnecessarily when cancellation cannot be proved. Preserve current no-such-
unit behavior conservatively; do not infer stop acknowledgement from inactive.

This is a tiny bounded public correction routed through the existing implement
lane. All acceptance and existing tests are immutable; do not add or edit tests.
Scope only src/lanectl/fenced_train.py, <=250 added/deleted lines (expected much
smaller). No new dependencies, coverage suppression, broad refactoring, governance
edits or policy/cap changes. Preserve all existing helper interfaces and failure
reporting. Run the exact frozen acceptance. The ordinary full-suite gate applies.
The prior frozen lifecycle file uses a one-second timeout in missing-receipt cases
and requires exact-unit stop before cleanup; do not weaken it.

The root-owned host service source is merged, independently reviewed and VM-
qualified, but authenticated workstation installation and full real-repository
qualification remain pending. No live-host, deployment or product-clock claim.
Native workers keep their auth; candidate train code must never receive it.
"""

[scope]
paths = ["src/lanectl/fenced_train.py"]

[acceptance]
files = ["tests/stage8/test_fenced_train.py", "tests/stage8/test_acc_fenced_train.py", "tests/stage8/test_acc_fenced_train_recovery.py", "tests/stage8/test_acc_fenced_train_parents.py", "tests/stage8/test_acc_fenced_train_pending.py", "tests/stage8/test_acc_fenced_train_stop.py"]
exec = ["snip proxy -- uv run --no-sync pytest -q -p no:cacheprovider tests/stage8/test_fenced_train.py tests/stage8/test_acc_fenced_train.py tests/stage8/test_acc_fenced_train_recovery.py tests/stage8/test_acc_fenced_train_parents.py tests/stage8/test_acc_fenced_train_pending.py tests/stage8/test_acc_fenced_train_stop.py"]

[lint]
override = "This bounded correction targets unlanded A6. Prior frozen acceptance already passes there and is retained. Three new failed-stop assertions fail precisely; acknowledged-stop control passes. Combined fail-on-base remains mandatory; no gate or policy is disabled."
