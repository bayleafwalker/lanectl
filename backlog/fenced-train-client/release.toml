id = "fenced-train-client"
repo = "lanectl"
base_sha = "2cfa660fdce4a33303d67e9cfaeb0160c6410002"
revision = 6
title = "Execute ownership-compatible train checks through the separate-UID service"
task_class = "recovery"
size = "S"
data_class = "public"
eligible_lanes = ["implement"]

outcome = """
Repair the independently reproduced queued-start lifecycle error in the public
fenced client. This is a small public correction routed through the existing
implementation lane; first-party source review remains separate. No private code,
credentials, policy edits or increased lane caps are authorized.

Base 2cfa660 is the complete corrected source from A4. Its descriptor-relative
parent walking, nonblocking inspection, nonce/root receipt binding, no-copyback,
coordinated admission and namespace/environment semantics already passed focused
and full-suite gates. Independent review found one remaining model error: after
systemctl start --no-block, an initial inactive reading can describe a queued
start. _wait_terminal currently treats it as terminal after only a short receipt
grace, allowing outer cleanup while the unit may still start or run. Root froze
two safe synthetic-clock regressions; both fail precisely on this base, without
real services, sleeps, unsafe reads or hanging FIFOs.

Wait for BOTH receipt existence and terminal inactive/failed state within the
existing overall deadline. While the receipt is absent, continue observing
liveness even if a poll says inactive. A missing receipt at the deadline must
return false so run_command takes its existing stop/terminal-proof/orphan path.
Do not trust receipt existence without terminal state. Preserve cancellation,
KeyboardInterrupt, failed-stop named-orphan retention, cleanup only after proven
termination, and nonzero infrastructure failures with no fallback. Do not shorten
existing host stop limits or change request/receipt authority.

The new frozen file also exercises _stage from actual git worktree add sources,
both branch train and detached historical checkouts. Those two tests already pass
on the base; they close the independent review's coverage gap without requiring
any staging rewrite. All prior frozen acceptance remains required. Acceptance
files, existing tests, governance and public host contract are immutable. Do not
add tests: all required cases are already frozen. Scope only fenced_train.py;
keep the correction bounded to <=250 added/deleted lines, ideally much smaller.
No new dependencies, coverage suppression, broad refactoring or privileged helper.

The public host contract remains files/host-contract.md. The root-owned systemd
service source is reviewed and VM-qualified, but workstation installation and
full real-repository qualification remain pending. Do not claim field proof or
change governance repository isolation modes. Preserve every _stage, _manifest,
_mutation and _request interface used by the frozen proofs. Run the exact frozen
acceptance and report actual results. Existing full-suite repo gate also applies.
"""

[scope]
paths = ["src/lanectl/fenced_train.py"]

[acceptance]
files = ["tests/stage8/test_acc_fenced_train.py", "tests/stage8/test_acc_fenced_train_recovery.py", "tests/stage8/test_acc_fenced_train_parents.py", "tests/stage8/test_acc_fenced_train_pending.py"]
exec = ["snip proxy -- uv run --no-sync pytest -q -p no:cacheprovider tests/stage8/test_acc_fenced_train.py tests/stage8/test_acc_fenced_train_recovery.py tests/stage8/test_acc_fenced_train_parents.py tests/stage8/test_acc_fenced_train_pending.py"]

[lint]
override = "This bounded correction deliberately targets unlanded A4 2cfa660. Earlier acceptance and the new linked-worktree staging tests pass there. Two new queued-start lifecycle assertions fail precisely; combined fail-on-base remains mandatory. No check or policy is disabled."
