id = "fenced-train-client"
repo = "lanectl"
base_sha = "e6aa0afb513787e7b1fbbdad182a0f4f22190948"
revision = 2
title = "Execute ownership-compatible train checks through the separate-UID service"
task_class = "recovery"
size = "M"
data_class = "public"

outcome = """
Revision 2: preserve and repair the existing complete implementation from
artifact b646f969e2ab85f7e679ad25472e0b4590445c31 (git show that commit's
src/lanectl/fenced_train.py, config.py, doctor.py, runner.py and new test file).
It was rejected for a forbidden coverage-suppression directive. Remove it;
do not copy suppression/skip directives into any source or tests. Reuse the
reviewed staging and isolation architecture rather than rewriting it.
The host contract was tightened after independent review: every request must
carry a fresh secrets.token_hex(16) nonce, and its digest covers those bytes.
A success receipt must include handed_back=true; require that field and reject
missing/false completion before returning success. The host stop/handback limit
is now 600s per phase, so allow bounded observation through that window without
mistaking deactivation for terminal state. Preserve honest failure on unknowns.
Interrupted uncertain starts already attempt stop, but currently re-raise a
bare KeyboardInterrupt without identifying the still-live unit. When stop is
unproved, preserve the directory and identify the exact orphan unit and path in
the raised interruption message. Surface cleanup failures during interruption,
too. The new frozen recovery test reproduces the missing actionable orphan.
Keep _stage(checkout,dest) and _request(repo,command,timeout) signatures for the
focused recovery falsifiers. A non-interruption lost-start-ack case already
passes; preserve it. These changes include a planner host-contract correction
and a model recovery-message error, alongside the correctly caught forbidden
directive. Fit within the existing 700-line cap by trimming your own comments
or redundant tests if needed, never weakening frozen acceptance or old tests.

Implement the lanectl side of approved #2889, selecting train_isolation="systemd"
as an opt-in third mode; namespace remains default and environment remains refused
for coordinated work. The public host contract is files/host-contract.md in this
release (absolute read-only source: /projects/dev/lanectl/backlog/fenced-train-client/files/host-contract.md): use its fixed root-owned system service and root-owned receipt, never
introduce a privileged helper, new dependencies, sudo or per-request mount grants.

API: lanectl.fenced_train.run_command(repo, checkout, command, timeout_s=1800)
returns CompletedProcess with captured diagnostic output and a nonzero status on
any launch, fence, receipt, source-mutation, timeout or cleanup failure. Wire all
existing train setup/check/recheck/historical paths through this boundary using
runner._train_command, preserving other modes. Coordinated runner admission and
execution accept the two fenced modes only; doctor reports configured systemd
service absence clearly and still warns about environment-only repositories.

Use a fresh safe per-command ID and a self-contained staged Git checkout below
/var/lib/lanectl-train/trains/<id> (no gitdir outside, alternates or hardlinks).
Never run candidate code as the coordinator while staging or inspecting results.
The original checkout, canonical repo, governance and coordinator state must
remain unchanged. Stage the exact source commit; detect tracked-source or HEAD
changes caused by checks without executing attacker-controlled Git config,
filters, hooks or arbitrary code outside the fence. No source or .venv copyback.
For each fresh check-stage, run the repository's configured setup inside the same
fence before the requested command unless that command is setup itself. Do not
reuse a virtualenv referencing /projects; correctness precedes cache reuse.

Run the fixed systemctl start --no-block template (never --user), poll the exact
instance, and wait until terminal before accepting a result or deleting its dir.
On timeout, cancellation, KeyboardInterrupt or errors after start, stop that exact
instance and establish terminal state before cleanup. Unknown liveness must not
be treated as stopped; leave a named actionable orphan if stop cannot be proved.
Missing host service, authorization refusal and all infrastructure errors fail
closed; never call the environment/namespace runner as a fallback. Bound waits.
Journal stdout/stderr can be read using journalctl for the unique exact instance.
Forward no coordinator/native-provider token or credential directory, operator
HOME, XDG homes, UV cache or arbitrary environment. Host supplies fresh HOME/tmp
and system PATH. Native workers retain their existing separate auth behavior.

Only /var/lib/lanectl-train/results/<id>.json is authoritative. Read it without
following symlinks, require a root-owned regular file and root-owned parent that
are not group/other-writable, and bind version, train_id and request_sha256 to
the exact submitted bytes. Refuse candidate-controlled in-tree results entirely.
Expose receipt_returncode(record, *, train_id, request_sha256): int, raising
ValueError for malformed/mismatched receipts and returning 0 only for a coherent
success (outcome succeeded/service_result success/exit_code exited/exit_status 0).
Every other coherent outcome is nonzero. Add realistic fake-systemctl lifecycle
tests and hostile file/receipt/mutation tests; no live host service is required
in the package suite. Actual host/full-repository qualification is the planner's
next step; do not change governance/repos.toml or claim field qualification.
Existing exact-tip and stale/dirty train proof behavior remains in force.
Keep total added+deleted code/test lines <=700 excluding frozen acceptance.
"""

[scope]
paths = ["src/lanectl/fenced_train.py", "src/lanectl/runner.py", "src/lanectl/config.py", "src/lanectl/doctor.py", "tests/stage8/test_fenced_train*.py"]

[acceptance]
files = ["tests/stage8/test_acc_fenced_train.py", "tests/stage8/test_acc_fenced_train_recovery.py"]
exec = ["uv run --no-sync pytest -q -p no:cacheprovider tests/stage8/test_acc_fenced_train.py tests/stage8/test_acc_fenced_train_recovery.py"]
