id = "cf-reservations"
repo = "lanectl"
base_sha = "85a4f1d730b2ee5048273162bc0974551f17faf3"
revision = 2
title = "Reserve capacity atomically at admission and reconcile on completion or recovery"
task_class = "semantic"
size = "M"
data_class = "public"
outcome = """
Plan docs/plans/2026-11-09-decision-records-and-capacity-feedback.md: separate cumulative snapshots,
incremental usage, in-flight reservations and outside-lane spend; reserve atomically at admission and
reconcile against actual usage on completion or recovery; deduplicate overlapping usage sources.
Contracts capacity.reserved / capacity.reconciled are in contracts.py (planner-owned; do not edit).

1. runner.admit: right after item.claimed, inside the same log lock, when the claim's worker
   (adapters.worker_for(model)) is a provider in the allocation policy, append capacity.reserved:
   reservation_id "res-<attempt_id>", provider, pool (policy pool), unit (policy unit), amount = the
   estimate capacity_admission uses for the release size, attempt_id. No policy or provider -> none.
2. runner.execute: after attempt.finished (and usage.recorded when present), append
   capacity.reconciled for the attempt's open reservation: actual = adapter usage units[unit] (None
   when the adapter reported no usage), outcome "completed". reap.reap: when it closes or recovers an
   attempt with an open reservation, append capacity.reconciled actual None, outcome "recovered".
   A reservation is reconciled at most once.
3. capacity: in_flight(events, provider, pool) = sum of amounts of reservations with no
   capacity.reconciled. qualified() views gain "in_flight"; capacity_admission subtracts in_flight
   from burnable when basis is measured (unknown stays unknown) and mentions it in a reason.
The estate fixture comes from tests/stage7/conftest.py: tests use it without importing it.
4. Usage dedup: in capacity's usage folding (project, qualified), usage.recorded events that share
   (provider, attempt_id) count once (the latest); events without attempt_id are counted as today.
"""
[scope]
paths = ["src/lanectl/runner.py", "src/lanectl/reap.py", "src/lanectl/capacity.py", "tests/stage7/**"]
[acceptance]
exec = ["uv run --no-sync pytest -q -p no:cacheprovider"]
files = ["tests/stage7/test_acc_reservations.py"]
