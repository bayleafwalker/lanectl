id = "bx-backlog"
repo = "lanectl"
base_sha = "78be49fb5702c7611deb402c90c705732e2dcbc7"
revision = 1
title = "Backlog list and show"
task_class = "view"
size = "M"
data_class = "public"
outcome = """
Plan docs/plans/2026-11-10-backlog-dx-and-admin-views.md, wave 1. Today the operator needs status,
events --item and release.toml to see the backlog. Add src/lanectl/backlog.py:

backlog_rows(releases, events) -> list[dict], sorted by id, one row per WorkRelease with keys
id, repo, title, task_class, size, revision (release.toml revision), published (highest
release.published revision in the log, 0 when never published), state (the item state from
events.project_items, or "new" when the item is not in the log), tries (number of attempts) and
last_reason (ItemView.last_reason).

A plugin command (module-level register(sub), like view.py) "backlog" with subcommands:
- "list [--state STATE ...] [--repo REPO] [--open] [--json]": a table with columns STATE, ID, REPO,
  REV, TRIES, TITLE, then a summary line "<n> releases: <state>=<count> ..." with states in sorted
  order. --state is repeatable, --open drops landed rows, --json prints the filtered rows as a JSON
  list instead of the table and summary.
- "show <id>": the release fields (id, repo, title, task_class, size, data_class, revision,
  base_sha, scope paths, acceptance files), its state, one line per attempt with attempt_id, model,
  decision (or the item state for the open attempt) and reason, then the outcome text. An unknown id
  prints "unknown release <id>" to stderr and returns 2.
Read releases with config.load_releases() and the log through the EventLog the handler receives.
"""
[scope]
paths = ["src/lanectl/backlog.py", "tests/stage8/**"]
[acceptance]
exec = ["uv run --no-sync pytest -q -p no:cacheprovider"]
files = ["tests/stage8/test_acc_backlog.py"]
