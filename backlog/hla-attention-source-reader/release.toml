title = "Provide exact four-kind attention source reads without growing legacy facades"
outcome = "Implement the complete four-kind source reader prerequisite for HLA1593, including cohesive facade extraction, authority and identity/error behavior, and all required verification and staging described below. This is a source-layer prerequisite only; the complete downstream API, UI, verification and delivery work remains open.\n\nThis is a genuine source-layer prerequisite for the complete approved HLA1593 outcome, not delivery of the final record HTTP APIs or whole Work. Keep the full follow-on: all4 own-source record endpoints, generated contracts, ranked individual UI, independent review, verify-fast, real train/dev and canonical CI/merge. Original API R3 is parked after native timeouts; do not mark it complete or bypass its failed outcomes. A complete structural/error-correct prototype measured771 lines including460 generated and72 HTTP regressions; M700 is unchanged. Split by layer, never by omitting kinds or tests.\n\nThis packet ONLY adds the complete source reader for all four kinds and a cohesive facade extraction/classification. Base canonical9cf62cb7271ed0e15e35877ab772709808470bea. Do not add HTTP routes or generated/frontend changes here. Native implementation owns declared frozen acceptance and changed-code checks; the integration owner separately owns independent review/full verify-fast/train/dev/CI before landing. Finish and hand off the source after your declared checks rather than consuming the native implementation window on the whole delivery stack. This does not waive any later gate.\n\nPublic contract to freeze:\n- Existing ReportingService construction and access modes remain supported.\n- Existing get_open_attention_items() behavior remains unchanged; later UI stage owns urgency ranking.\n- New ReportingService.get_attention_record(item_type, item_id) -> list[dict[str,Any]] returns the complete exact group from the current source publication.\n- Export AttentionRecordNotFoundError (provable absence) and AttentionRecordUnavailableError (source/identity cannot establish absence) from packages.domains.overview.pipelines.attention_records. Do not freeze registry/query/mixin internals.\n- The four kinds are anomaly / mart_transaction_anomalies_current (anomaly_ + transaction_id); contract_review / mart_contract_review_candidates (review_ + contract_id + _ + reason); contract_renewal / mart_contract_renewal_watchlist (renewal_ + contract_id + _ + ISO renewal_date); upcoming_cost / mart_upcoming_fixed_costs_30d (upcoming_ + canonical charge_id + _ + ISO expected_date). Whole keys are opaque: slash/underscores and literal nonempty None text are valid; no splitting, guessed/equal-looking or first-row match.\n- Lookup binds the complete key in real source SQL before limit/pagination or Python selection. Query-result observation must establish matching groups, not merely a WHERE substring or tautology. Competing source identities and an out-of-first-page anomaly must discriminate fetch-all/filter-later implementations. Scalar unkeyed metadata queries may not fetch source facts.\n- WAREHOUSE uses the warehouse; PUBLISHED uses only the current publication, never warehouse fallback/retained-history substitution. Preserve PREFER_PUBLISHED semantics where supported. A missing PUBLISHED store/relation, unreadable publication, missing required identity column, NULL/empty identity component, or PG/DuckDB driver failure must raise the unavailable exception as appropriate; a provably absent key raises not-found. Intact matching siblings still resolve even with unrelated invalid rows. Getter does not repair, refresh, promote or mutate source publications.\n- No successful IDs may be fabricated from SQL/Python NULL or empty textual identity. Explicitly cover charge_id plus anomaly transaction_id, review contract_id/reason, renewal contract_id. Prove current public model and actual Postgres store admit the empty mutation; assert forged key never resolves, and a canonical-looking unknown is404-equivalent/not-found before invalidation then unavailable after it. Valid unrelated groups remain exact. Do not reject unrelated empty display fields or impose arbitrary identifier formats. Nonempty opaqueNone/utility is a positive exact multi-component review/renewal control.\n- Current expected_date=None is rejected by the public row model and fresh NOT NULL PG table: do not drop constraints to manufacture unsupported inputs or claim such HTTP results. Legacy charge_id NULL/missing-column shapes are supported measured compatibility cases.\n- A representative psycopg.OperationalError at the actual publication-store connection entry must become unavailable, never warehouse substitution. Keep the distinctive synthetic driver marker out of the exception's public message. WarehouseBusyError and unrelated programming RuntimeError retain their established behavior rather than being masked as source-unavailable. This source packet is not HTTP: test the real facade and stores directly, not routes that arrive only in the next packet.\n\nPlacement/structural requirements from existing repo rules:\n- Cross-domain household identity composition belongs to overview; do not classify it generic kernel. packages/domains/overview/pipelines/attention_records.py is the planned public exception home. New transitional pipeline files need explicit correct classification before merge.\n- ReportingService is already >2x its next-largest package peer. Final packages/pipelines/reporting_service.py must not grow relative to the1534-line canonical base while that ratio remains. A cohesive extraction of the existing attention-list method alongside new attention reads is permitted; preserve its behavior. No unrelated legacy refactor or blank-line/code compression to satisfy the cap. apps/api/routes/report_routes.py stays unchanged (1257 lines); no app registration in this packet.\n- Only declared source, overview and relevant classification/test paths. No migrations, grants, auth policy, dependency, CI, gate or governance changes. Whole formatted worker additions+deletions <=700 including worker tests/docs; frozen planner acceptance is input as normal. If a complete readable implementation still exceeds cap, report measured aligned decomposition, never omit behavior.\n\nAcceptance author: derive requirements from canonical source and this declared contract, not from the unaccepted implementation/prototypes. Make the new tests self-contained or reuse VERIFIED existing canonical test helpers. In particular tests/test_attention_record_api.py is NOT present on canonical9cf (it is unaccepted frozen API input) and cannot be imported as a fixture shortcut. No setup/import failures masquerading as expected feature failures. Prefer one standalone frozen file with synthetic normalized-loader data covering all kinds, ambiguous equal-looking payments with distinct canonical IDs, slash utility IDs, multiple reason/date identities and multiple component rows. Use real DuckDB plus the actual disposable PG adapter, whole-group equality, wrong/excluded IDs, true source SQL filtering observation, source authority and no-warehouse-read observations. New tests must fail on canonical for the actual missing source-reader feature, not unrelated fixtures.\n\nReal PG cases should use existing integration/slow conventions and must actually run before publication/landing; repository pytest defaults to not slow. The planner will make the explicit slow selector mandatory before publishing after exact independent review. No skip/xfail/noqa/type-ignore. Preserve synthetic fixture cleanup. Existing public row models can establish boundary input admission; no production data or credentials. No source snapshot/history mutation, no new recommendations, UI or household semantics. Whole HLA1593 remains active after this prerequisite.\n"
