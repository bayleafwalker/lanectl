id = "train-cleanup-boundary"
repo = "lanectl"
base_sha = "8bcd81a932956e75f56f5340ad79b2ed4733fd14"
revision = 3
title = "Prevent cleanup from deleting the canonical repository or its ancestors"
task_class = "recovery"
size = "S"
data_class = "public"
eligible_lanes = ["implement"]

outcome = """
Close the independently reproduced shared-container deletion gap while retaining
R2's canonical contents, historical recovery and truthful landing fixes. Base is
the complete reviewed R2 artifact. Its full suite passed, but review held it:
when worktree_root is strictly inside canonical, target==worktree_root is treated
as an allowed disposable target. This can delete all sibling attempts or expose
them writable during historical checks. Root froze safe interceptors; no real
data was deleted. Do not land the held artifact unchanged.

The configured worktree_root itself, or a symlink alias resolving to it, is a
shared container, never an individual disposable checkout. Protect it from
_discard and reconstruct historical checks elsewhere if a record names it.
Apply this equality boundary whether the container is inside or outside canonical.
A root equal to/above canonical still grants no deletion permission. Individual
managed checkout descendants remain cleanable and usable for historical checks.
Do not restrict ordinary cleanup by pretending every outside path is canonical;
preserve existing scratch cleanup behavior and all prior canonical guards.

Existing R2 behavior must remain: unmanaged canonical contents (.git/src) and
aliases are protected; overlapping historical paths use scratch; post-land
refusal leaves a truthful landed result and continues cleanup of safe attempts.
The frozen historical-land proof now creates a real safe attempt directory and
asserts that it is removed after canonical cleanup is refused.

All tests are frozen, including eight new container/layout/alias/operation cases.
Do not add or edit tests. Scope only runner.py, <=250 added/deleted lines, no
broad refactoring, dependencies, coverage suppression, governance/policy/cap
changes or weakened exact-tip/isolation/landing gates. Run exact acceptance and
the full-suite gate. No production, owner or credential effects are authorized.
"""

[scope]
paths = ["src/lanectl/runner.py"]

[acceptance]
files = ["tests/stage8/test_acc_train_cleanup_boundary.py", "tests/stage8/test_acc_train_cleanup_recovery.py", "tests/stage8/test_acc_train_cleanup_container.py"]
exec = ["snip proxy -- uv run --no-sync pytest -q -p no:cacheprovider tests/stage8/test_acc_train_cleanup_boundary.py tests/stage8/test_acc_train_cleanup_recovery.py tests/stage8/test_acc_train_cleanup_container.py"]

[lint]
override = "This correction targets held unlanded R2. Earlier canonical/recovery tests pass there; eight safe new shared-container assertions fail. The strengthened safe-attempt cleanup positive already passes. Combined fail-on-base remains required, with no gate waiver."
