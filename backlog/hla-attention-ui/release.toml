title = "Show ranked current attention records with authorized details"
outcome = "Implement the complete Operating Picture current-report queue and four-kind individual record UI over the canonical public API at b2d0fe393ac0971e906cce275e91f45e94422593. Full HLA1593 remains open until all independent review, verify-fast, train/dev, canonical CI and product smoke complete. Reuse the tracked default-shell visual system and first copy the three root-published intent/baseline/ui-contract artifacts to apps/web/frontend/ui-contracts/attention-current-report/ before broad UI work; count all worker artifacts, including these copied files, in M700. Copy exactly from /projects/dev/lanectl/docs/evidence/2026-11-14-product-contact/ui-stage-contracts/: intent.md SHA256 fb195a7c65517da1c0b4781759f1f89fb636f759e90b7befca55f788e9cb1f85; baseline.tokens.json SHA256 ce1a7d8a48cf483519994f5d37872b49fe8472950bc6ef89a4451970c4f9c862; ui-contract.yaml SHA256 603153cffbf78388d003a30387d4a2db63a3e4289da0e18a96fa934bc6392ee1. Verify hashes and commit these copied contracts first before broad UI code.\n\nOn the real production Operating Picture page, rank strictly numeric severity 3 urgent, 2 soon, 1 watch before the existing top-eight limit, with stable input order for ties. Missing, null, numeric strings, nonnumeric and unsupported numbers are Unknown, neutral and last in input order; NaN is not valid JSON and may only be exercised at a suitable pure JS boundary. A successful empty array alone may display no items/all clear. Missing, null, malformed or non-array attention rows produce an error/unavailable state, never all-clear. Label queue Current report separately from cashflow month and do not claim observation time, freshness, historical provenance or recommendations.\n\nEach record links to its own /operating-picture/attention/[kind]/[key] Next page. Allowlist all four item types anomaly, upcoming_cost, contract_review and contract_renewal; encode the whole UTF-8 item_id into an unpadded base64url route key and strictly/canonically decode it server-side. Never split, guess, double encode, cross-resolve or truncate identifiers; encoded slash and underscores must survive actual click, deep link and exact source API lookup. Use existing generated API types and authenticated client with a narrow record transport; do not change global backendGet or other callers. No new grants, dependencies, source reader or API modifications.\n\nRender every returned source row separately with meaningful public fields: anomaly counterparty, booking date, amount, direction and reason; upcoming contract/provider, expected amount/currency, frequency, expected date and confidence; review provider/type, reason, current price/currency and available market reference; renewal contract/provider, date/days and current price/currency. Preserve precision and treat null or missing as Unknown; do not fabricate currency, component labels, savings, price aggregation, freshness, deleted status or history. Current source authority and each own-source permission apply. 401 uses existing login redirect; 403 denied without fallback or source facts; 404 not found in current report; 503 source unavailable and Busy body render safe unavailable, never all-clear; 500 remains unexpected error. Do not leak arbitrary response bodies or query list/other sources for denied/unavailable detail.\n\nRetain existing AppShell and focus, responsive and reduced-motion conventions. Add Storybook scenarios for all four kinds, nulls/multirow, empty and failures, plus narrow viewport, keyboard and axe checks. Acceptance exercises real Next page/browser with dynamic generic controlled transport (>8 unsorted, all severity cases and controlled errors) and a separate actual canonical API + reader + disposable synthetic Postgres test for all four types and complete groups, same-kind identities, slash and public facts; fake transport is not real API auth or publication proof. All required acceptance commands and real PostgreSQL preflight must execute without skip; missing tools/setup are explicit failures. The frozen test CLI executes all nine named cases under pytest and rejects absent, malformed, incomplete or skipped JUnit evidence; normal pytest collection is inert. Preserve frozen acceptance bytes. The test cases are planner input only; independently authored worker tests remain worker diff. M700 includes formatted worker additions+deletions including regression tests, generated files, docs and copied contract artifacts. Size is unmeasured: no kind, test or behavior cuts, no cap waiver or reclassification. If full solution does not fit, report evidence for a genuine prerequisite while preserving all four kinds and complete outcome.\n\nRun changed tests, frontend typecheck and appropriate generated/token checks, existing 55 UI tests with matched Ubuntu Playwright 1.59.1 and unchanged snapshot tolerances, then make verify-fast. The integration owner separately performs independent review, train/dev and CI. The requested first-party acceptance author model is gpt-6.1-terra; this records the requested model rather than attesting native author usage or runtime identity. Native GoPro independent review must occur before publication; no review verdict is claimed."
