id = "s4-report-sections"
repo = "lanectl"
base_sha = "8cfba286a720fc0fceec2b2009cb515f7b7cb868"
revision = 1
title = "Report sections as a registry so stage features stop colliding"
task_class = "tooling"
size = "S"
data_class = "public"
outcome = """
Every stage feature adds a key to build_report's return dict and a block at the end of
format_report; three train merge conflicts on 2026-11-08 came from those two spots. Add a section
registry in report.py: register_section(name, build, fmt=None) where build(events) -> value and
fmt(value) -> list[str] (lines). build_report adds report[name] = build(events) for each registered
section; format_report appends fmt(value) lines for each section that has a fmt. Move evaluator,
landing_shadow and shadow_admission onto it (their modules register at import time; report.py
imports them in one place, sorted). Keep the report keys and values unchanged, and give
shadow_admission a formatted line "shadow_admission: recorded=<n> agreed=<n> agreement=<p>" that
format_report does not print today. Section output order is registration name order.
"""
[scope]
paths = ["src/lanectl/report.py", "src/lanectl/evaluator.py", "src/lanectl/landing.py", "src/lanectl/capacity.py", "tests/stage4/**"]
[acceptance]
exec = ["uv run --no-sync pytest -q -p no:cacheprovider"]
files = ["tests/stage4/test_acc_report_sections.py"]
