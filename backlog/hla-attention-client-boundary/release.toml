title = "Add four-kind authenticated attention record client boundary"
outcome = "Implement the four-kind frontend record client boundary prerequisite on canonical HLA b2d0fe393ac0971e906cce275e91f45e94422593. The full UI and HLA1593 remain open. First-party planner authored this outcome; no native-author run or review is asserted. Worker must copy the frozen style triplet first and count those files, all worker regression tests, and documentation toward M700. Scope is limited to apps/web/frontend/lib/attention-key.ts, apps/web/frontend/lib/attention-record.ts, apps/web/frontend/ui-contracts/attention-current-report/**, tests/** and docs/**. No backend.ts, page, view, feed, dependency, generated-contract, API or auth modifications.\n\n\nNative worker first copies unchanged the existing frozen `apps/web/frontend/ui-contracts/attention-current-report/{intent.md,baseline.tokens.json,ui-contract.yaml}` from /projects/dev/lanectl/docs/evidence/2026-11-14-product-contact/ui-stage-contracts/: respectively 9, 43 and 32 lines, 84 total; SHA-256 `fb195a7c65517da1c0b4781759f1f89fb636f759e90b7befca55f788e9cb1f85`, `ce1a7d8a48cf483519994f5d37872b49fe8472950bc6ef89a4451970c4f9c862`, `603153cffbf78388d003a30387d4a2db63a3e4289da0e18a96fa934bc6392ee1`. The worker's own diff includes these bytes, all tests, generated changes, and docs; root does not pre-copy them or reclassify worker regression lines. They are frozen existing-style reuse, not a claim of new human approval. No broad UI implementation in this prerequisite.\n\nAdd **`apps/web/frontend/lib/attention-key.ts`**, dependency-free and safe in Node 20 and browser:\n\n```ts\nexport const ATTENTION_RECORD_KINDS: readonly [\"anomaly\", \"upcoming_cost\", \"contract_review\", \"contract_renewal\"];\nexport type AttentionRecordKind = (typeof ATTENTION_RECORD_KINDS)[number];\nexport function isAttentionRecordKind(value: unknown): value is AttentionRecordKind;\nexport function encodeAttentionKey(itemId: string): string;\nexport function decodeAttentionKey(key: unknown): string | null;\n```\n\nEncode a nonempty, well-formed Unicode string as its complete UTF-8 bytes, canonical unpadded base64url. Throw `TypeError` for empty, non-string at runtime, or unpaired surrogate: never silently replace bytes. Decode returns null for non-string/empty, characters outside base64url alphabet, padding, impossible length, noncanonical tail bits, invalid UTF-8, or decoded empty string; otherwise returns the exact whole string. No splitting, guessing prefix, case folding, duplicate identity parsing, or separate special case for slash/underscore. Encoding and decoding must work under browser and server runtimes, without a new dependency or Node-only Buffer in browser code. Invalid kind/route key must not issue any backend request.\n\nAdd the following exports to new server-side **`apps/web/frontend/lib/attention-record.ts`**. Import `backendRequest` from `./backend`, the key functions/types from `./attention-key`, generated `components` as type-only from `../generated/api`, and `redirect` from `next/navigation`. Keep `backend.ts` entirely unchanged: no re-export, facade addition, dependency cycle, `backendGet` edit or change to its callers. Canonical b2 `backend.ts` is already 1,517 lines; `backendRequest` is exported at lines 335\u2013346, returns raw `Response`, and its typed GET overload accepts the four generated literal paths. Its existing `createBackendFetch` at lines 249\u2013270 forwards request-context cookies with `cache: no-store` and `redirect: manual`; `buildOperationPath` at lines 307\u2013320 applies `encodeURIComponent` once. Four explicit literal branches keep generated OpenAPI path/row types correlated. The new module handles status and parses a successful body locally; no changes to generic auth/transport helpers or generated contract are needed. An adapter confined to this reader may catch network/JSON errors, but never catches Next redirect control flow or exposes error body/secret/key in exceptions.\n\n```ts\nexport type AttentionPublicRows = {\n  anomaly: components[\"schemas\"][\"TransactionAnomaliesRow\"];\n  upcoming_cost: components[\"schemas\"][\"UpcomingFixedCostsRow\"];\n  contract_review: components[\"schemas\"][\"ContractReviewCandidatesRow\"];\n  contract_renewal: components[\"schemas\"][\"ContractRenewalWatchlistRow\"];\n};\nexport type AttentionSafeRow<T> = { [P in keyof T]?: T[P] | null };\nexport type AttentionRecordResult<K extends AttentionRecordKind = AttentionRecordKind> =\n  | { [P in K]: {\n      status: \"ok\";\n      kind: P;\n      item_id: string;\n      rows: AttentionSafeRow<AttentionPublicRows[P]>[];\n    } }[K]\n  | { status: \"invalid\" | \"denied\" | \"not_found\" }\n  | { status: \"unavailable\"; retryAfter: string | null };\nexport function getAttentionRecord<K extends AttentionRecordKind>(kind: K, routeKey: string): Promise<AttentionRecordResult<K>>;\nexport function getAttentionRecord(kind: unknown, routeKey: unknown): Promise<AttentionRecordResult>;\n```\n\nThe public operation consumes the encoded route key, validates kind and decodes the key **before** request, so invalid values return `invalid` and cause zero fetches. On success require an object envelope with exactly public keys `item_id` and `rows`, exact returned `item_id ===` decoded whole ID, an array of non-null non-array row objects, and only field names of the corresponding generated public row model. Reject any malformed JSON/envelope, unexpected ID, non-object row, unexpected key, or present non-null value of the wrong generated scalar type with a sanitized protocol error; do not turn it into `[]`, substitute a requested ID, or expose any row. Missing and null known row fields remain absent/null for future `Unknown` UI; no prices/currencies/numbers are coerced and no data is invented. `rows: []` is a valid envelope under the generated contract, passed through unchanged; no claim it proves record existence outside API authority. Preserve all row order, duplicate multiplicity and all declared public fields exactly. These runtime checks justify the safe optional/nullable generated row type without asserting that a missing field is populated.\n\nMappings (all are GET and source-authorized independently):\n\n| Kind | Exact typed path | Generated row |\n|---|---|---|\n| anomaly | `/reports/transaction-anomalies/records/{item_id}` | `TransactionAnomaliesRow` (amount string; no currency) |\n| upcoming_cost | `/reports/upcoming-fixed-costs/records/{item_id}` | `UpcomingFixedCostsRow` (charge_id nullable, amount string) |\n| contract_review | `/reports/contract-review-candidates/records/{item_id}` | `ContractReviewCandidatesRow` (market_reference nullable string) |\n| contract_renewal | `/reports/contract-renewal-watchlist/records/{item_id}` | `ContractRenewalWatchlistRow` (contract_duration_days nullable number) |\n\nCheck status **before** reading arbitrary error bodies: 401 calls `redirect('/login')` outside catch; 403 returns `denied`, 404 `not_found`, 503 `unavailable` with `retryAfter` set only to a syntactically valid nonnegative integer delta-seconds or valid HTTP-date header, otherwise null, without parsing/copying error content. Busy 503 with Retry-After and source-unavailable 503 both remain unavailable; the safe header is transport metadata, not copy to render verbatim. Any other non-OK, including 500, throws sanitized error. A transport/network or malformed-success protocol failure throws sanitized error, not absent/empty/denied; no status mapping should catch Next's redirect exception. No fallback to list, first page, another source, warehouse, generic detail, or a separate auth mechanism. API/source authorization, reporting_service and all old routes remain unchanged.\n\n\nComplete all mandatory frozen acceptance tests and the no-skip CLI. Add independent meaningful worker regression tests within M700. No skip, weakening or cap waiver. Real local DuckDB publication qualification is distinct from downstream required real PostgreSQL and deployed product checks.\n\n\nPrerequisite has no new user-visible queue/detail and does not complete #1593. On its canonical land and CI, root independently rebases/revalidates corrected full-UI acceptance and freezes it against the **actual new canonical head**; the old race/500 scratch correction is not an accepted a1 adoption. Full follow-on retains feed handling/ranking and every kind's UI: severity 3 > 2 > 1, stable ties/unknown neutral last before top eight through real unsorted >8 production page; each distinct whole-ID real Next click/deep link; all source facts and all duplicate/multirow/null components; no invented anomaly currency, savings, aggregation, recommendations, history or freshness; current report distinct from cashflow month; 401/403/404/503 Busy/500 behavior, no fallback/leak. Test controlled failure fixtures separately from real API positives, preserve 55 matched Ubuntu Playwright 1.59.1 checks and visual tolerances, keyboard/mobile/ARIA, full verify, independent review, exact-tip train, guarded normal dev deploy/health, canonical PR/CI and four-kind per-record product smoke.\n\nA2 shows 728 combined lines for one rejected design, not a forecast. This boundary's complete native diff must be measured after formatting, including 84 contract lines and every worker test/doc/generated change; expect it to be meaningfully smaller than the full UI, but no actual line count or successful completion is asserted. Final UI remainder must independently be measured under M700; do not assume subtraction from a rejected implementation proves fit. Product-intention pass: `docs/product/core-household-operating-picture.md` requires explainable current household attention and stable publication, while `docs/plans/kotona-operating-picture-brief.md` does not make cashflow month a record observation. The prerequisite preserves those commitments, makes no new tracker registration, and does not affect pending private-owner authorization.\n"
