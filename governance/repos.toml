# Repositories a lane may target. Governance path.
[repos.lanectl]
path = "/projects/dev/lanectl"
main = "main"
setup_cmd = "uv sync -q"
test_cmd = "uv run --no-sync pytest -q -p no:cacheprovider {files}"
check_cmd = "uv run pytest -q"
worktree_root = "/projects/dev/_wt/lanes"

# Stage 3 gate jobs (2026-11-10): the full suite per attempt, in the attempt sandbox (477 passed
# in 60s there). Acceptance runs only the release's file, so a release that breaks an older test
# was caught only at the train check (s3-lint-expected-a1); this rejects it at the attempt.
[[repos.lanectl.gate_jobs]]
name = "suite"
cmd = "uv run --no-sync pytest -q -p no:cacheprovider"
timeout_s = 900

# Stage 6 fan-out (2026-11-08). Commands verified in fresh worktrees: python -m pytest puts the
# repo root on sys.path (plain pytest fails collection in both public repos).
# homelab-analytics: public (github). Fast suite 2679 passed in 11m on a fresh worktree.
[repos.homelab-analytics]
landing = "pr"     # GitHub PR + CI; tracker items close on merge
path = "/projects/dev/homelab-analytics"
main = "main"
setup_cmd = "uv sync -q --extra dev"
test_cmd = "uv run --no-sync python -m pytest -q -p no:cacheprovider {files}"
check_cmd = "uv run --no-sync ruff check . && uv run --no-sync python -m pytest -q -p no:cacheprovider -m 'not slow'"
worktree_root = "/projects/dev/_wt/lanes"
protected_paths = [".github/**", ".agents/**", ".claude/**", ".project/**", "AGENTS.md", "CLAUDE.md",
                   "charts/**", "infra/**", "migrations/**", "githooks/**", "requirements/**", "uv.lock",
                   "opencode.json", "homelab-analytics.dispatch.json"]

[[repos.homelab-analytics.gate_jobs]]
name = "ruff"
cmd = "uv run --no-sync ruff check ."
timeout_s = 300

# Stage 3 dev train deploy (docs/plans/2026-11-10-stage3-gate-jobs-and-train-deploys.md): the
# example compose stack as project lane-dev-<train>, images built from the train, loopback
# ephemeral ports, example credentials only. Pilot 2026-11-10: up 104s, healthy, clean teardown.
# The environment is stripped to env_allow; docker reaches /var/run/docker.sock by default.
[repos.homelab-analytics.deploy]
cmd = "bash scripts/lane-dev-deploy.sh up"
health_cmd = "bash scripts/lane-dev-deploy.sh health"
teardown_cmd = "bash scripts/lane-dev-deploy.sh down"
ttl_s = 3600
env_allow = ["PATH", "HOME"]

# sovite: public (github). Full suite exit 0 in 8m on a fresh worktree.
[repos.sovite]
# The separate-UID strict-root host fence preserves Sovite's ownership checks.
# Actual host qualification: 2797 passed / 1140 skipped, matching the clean
# baseline; credential/environment, lifecycle and cleanup probes also passed.
# See docs/fenced-train.md for the host requirements and residual boundaries.
train_isolation = "systemd"
path = "/projects/dev/sovite"
main = "main"
setup_cmd = "uv sync -q --extra test"
test_cmd = "uv run --no-sync python -m pytest -q -p no:cacheprovider {files}"
check_cmd = "uv run --no-sync python -m pytest -q -p no:cacheprovider"
worktree_root = "/projects/dev/_wt/lanes"
protected_paths = [".github/**", "AGENTS.md", "CLAUDE.md", "deploy/**", "contracts/**", "config/**",
                   "verification/**", "Dockerfile", "compose.yaml", "RELEASE-MANIFEST.json",
                   "requirements.lock", "uv.lock", ".gitleaks.toml"]

# vuoro-cloud: private Forgejo. Restricted floor: first-party (Claude) routes only, never
# OpenCode Go. Unit suite + ruff 4249 passed in 2m on a fresh worktree.
[repos.vuoro-cloud]
path = "/projects/dev/vuoro-cloud"
main = "main"
setup_cmd = "uv sync -q --extra test --extra admission-test"
test_cmd = "uv run --no-sync python -m pytest -q -p no:cacheprovider {files}"
check_cmd = "uv run --no-sync ruff format --check src tests scripts && uv run --no-sync ruff check src tests scripts && uv run --no-sync python -m pytest -q -p no:cacheprovider -m 'not integration'"
worktree_root = "/projects/dev/_wt/lanes"
data_class_floor = "restricted"
protected_paths = [".forgejo/**", ".agents/**", ".claude/**", ".sprintctl/**", "AGENTS.md", "CLAUDE.md",
                   "clusters/**", "deploy/**", "platform/**", "policy/**", "secrets/**", "terraform/**",
                   "migrations/**", ".sops.yaml", "uv.lock", "requirements.lock", "SHA256SUMS",
                   "HANDOFF_MANIFEST.json", "vuoro-cloud.dispatch.json", "flake.lock", "Containerfile"]

[repos.vuoro-cloud.routing]
"claude-sonnet-5-5" = 1.0

# appservice: public (github), GitOps for the appservice cluster. Flux applies main, so a lane
# landing under clusters/, configuration/ or repositories/ would be a production deploy; those
# paths are protected (production promotion stays an operator Decision, ladder plan). Lanes may
# change docs/ (CI, rebuild and qualification suites), verification/ and tests. check_cmd is the
# CI gate: `offline.sh validate` passed in 58s offline on a fresh worktree (563 passed, 2026-11-10).
[repos.appservice]
path = "/projects/dev/appservice"
main = "main"
test_cmd = "python3 -m pytest -q -p no:cacheprovider {files}"
check_cmd = "bash docs/scripts/ci/offline.sh validate"
worktree_root = "/projects/dev/_wt/lanes"
protected_paths = ["clusters/**", "configuration/**", "repositories/**", "data/**", "bin/**",
                   "scripts/**", ".github/**", ".sops.yaml", ".agents/**", ".claude/**",
                   "AGENTS.md", "CLAUDE.md", "project.toml", "mise.toml", "opencode.json",
                   "appservice.dispatch.json", "helm-toleration-allowlist.txt",
                   "kustomize-apps-allowlist.txt", "ops_state.md", "vscode-shell/**"]
