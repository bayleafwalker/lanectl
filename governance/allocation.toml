# Allocation policy: how capacity is budgeted, reserved and burned down.
# Every number here is a placeholder the planner revises from usage evidence.
# rev 4 (2026-11-08): burn-down rules.
# rev 3 (2026-11-08): per-size output-token estimates for shadow admission.
# rev 2 (2026-11-08): key renamed to "opencode" = provider recorded by the opencode adapter.
# rev 7 (2026-11-10): published per-model prices for dollar estimates (bx-cost-usd).
# rev 5 (2026-11-09): pool identity, observation freshness, reallocation dwell (decision-records plan).
revision = 7

[providers.opencode]
unit = "output_tokens"
expiring = true
# Shared subscription pool this provider draws from. Unqualified: one OpenCode Go
# subscription on this account is assumed; interactive and other-host use share it.
pool = "opencode-go:default"
# An observation older than this is stale: capacity becomes unknown, never zero.
freshness_s = 3600

# rev 6 (2026-11-09): budget verified against the published entitlement.
# Plan: OpenCode Go (operator-confirmed 2026-11-09). Published limits (opencode.ai/docs/go,
# read 2026-11-09) are per-model dollar amounts: DeepSeek V4.1 Flash $100/month, with
# 5-hour = 20% ($20) and weekly = 50% ($50) of the monthly figure. Window anchoring is
# not published. The weekly cap binds: 33.6 five-hour windows share $50, so 5h windows
# never expire meaningful capacity. One weekly window therefore models the entitlement.
# Conversion (estimate): today's pool mix at Peak prices ($0.30 in, $0.006 cache read,
# $1.20 out incl. reasoning) costs $6.43 per 1M recorded output tokens. Budget $22/week:
# half of $50 because a fixed anchor can straddle two provider weeks, and below $100/4.35
# so the monthly cap also holds. $22 / $6.43 per 1M = 3.4M output tokens.
# Since bx-burn-windows (2026-11-10) burn measures usage per window and takes the minimum,
# so a 5h window may be added once its anchor is known; until then one weekly window suffices.
[[providers.opencode.windows]]
name = "week"
length_s = 604800
budget = 3400000
budget_basis = "verified"

# Published OpenCode Go prices, USD per 1M tokens (opencode.ai/docs/go, read 2026-11-09).
# Peak: 01:00-04:00 and 06:00-10:00 UTC, Monday-Friday; all other hours are off-peak.
# Reasoning tokens are priced as output (estimate: the page lists no reasoning price).
[providers.opencode.prices]
peak_hours_utc = [[1, 4], [6, 10]]
peak_weekdays = [0, 1, 2, 3, 4]

[providers.opencode.prices.models."opencode-go/deepseek-v4.1-flash"]
offpeak = { input = 0.15, output = 0.60, cache_read = 0.003 }
peak = { input = 0.30, output = 1.20, cache_read = 0.006 }

[providers.opencode.reservations]
interactive = 0.0

# Output tokens one attempt of each release size is expected to burn. Placeholders:
# admission prefers the observed mean once 3+ attempts of a size have adapter usage.
[providers.opencode.estimates]
S = 15000
M = 40000
L = 100000

# Burn-down (stage 5): spend expiring capacity that would otherwise reset unused.
[burn]
start_within_s = 3600    # only plan a burn in the last hour of a window
min_burnable = 10000     # ignore smaller leftovers

# Reallocation damping: a new allocation applies only after min_dwell_s since the last
# applied one and when it moves the burnable amount by at least change_threshold
# (fraction). A provider denial (window.observed exhausted) overrides both immediately.
[allocation]
min_dwell_s = 1800
change_threshold = 0.2
