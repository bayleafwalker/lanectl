# Restricted lane (first-party only). Lane revision (a RecipeRevision). Governance path: interactive changes only.
# Every number here is a placeholder policy value, revised from ExperimentRecords.
lane = "restricted"
revision = 1

[eligibility]
size_max = "M"
# Restricted work (vuoro-cloud floor, data_class = "restricted") is eligible only here.
allow_restricted = true

[routing]
# Operator direction 2026-11-10: restricted work routes to first-party Claude only. Claude's
# allowance is shared with interactive sessions, so this lane is never run by the tick timer
# (tick runs "implement"); run it by hand: lanectl run --lane restricted --item <id>.
weights = { "claude-sonnet-5-5" = 1.0 }
external_models = ["opencode-go/deepseek-v4.1-flash", "opencode-go/deepseek-v4-pro"]
retry = "same_model"
max_attempts = 2
timeout_s = 2700

[caps]
concurrency = 1
items_per_day = 2     # hard daily cap on Claude lane attempts
accepted_unlanded_max = 2

[gates]
size_budget_lines = { S = 250, M = 700, L = 1500 }
protected_paths = [
  "governance/**", "backlog/**", "contracts/**",
  "src/lanectl/contracts.py", "src/lanectl/ready.py", "src/lanectl/gates/**", "src/lanectl/sandbox.py",
  ".github/**", ".forgejo/**", "pyproject.toml", "uv.lock",
  "tests/seed/**", "**/conftest.py", "AGENTS.md", "CLAUDE.md", ".claude/**",
]
dependency_manifests = [
  "**/pyproject.toml", "**/uv.lock", "**/requirements*.txt", "**/package.json",
  "**/package-lock.json", "**/pnpm-lock.yaml", "**/go.mod", "**/Cargo.toml",
]
test_globs = ["tests/**/test_*.py", "**/tests/**/test_*.py", "**/*.test.ts", "**/*_test.go"]
forbidden_added_patterns = [
  'pytest\.mark\.(skip|xfail)', 'pytest\.skip\(', 'unittest\.skip', '@skip\b',
  '\b(it|test|describe)\.(skip|only)\(', 't\.Skip\(', '#\s*type:\s*ignore',
  '#\s*noqa', '#\s*pragma:\s*no cover',
]

[effects]
push = "lane/*"

[sandbox]
# Workers and worker-written code run with these roots read-only; only the
# attempt checkout is writable (added 2026-11-08 after main-checkout writes).
mode = "systemd-run"
readonly = ["/projects"]
