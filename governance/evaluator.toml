# Evaluator rules v1 (planner-owned): predict the integrator's ruling on a
# gate-accepted attempt. First matching rule wins; otherwise `default`.
# Features (computed from git diff seed_sha..head_sha):
#   changed_lines        added + deleted lines
#   changed_lines_ratio  changed_lines / size budget of the release size
#   new_test_files       added files matching the lane's test globs
#   files_touched        files changed
revision = 2
# rev 2 (2026-11-08): dropped near-size-budget (2/2 false rejects: tests count toward the
# budget) and no-new-tests (1/1 false reject on a docs-only item). Re-add rules only with evidence.
default = "accept"

[[rules]]
name = "sprawl"
feature = "files_touched"
op = ">"
value = 8
verdict = "reject"
