[project]
name = "lanectl"
version = "0.3.2"
description = "Autonomous implementation lanes: deterministic admission, gates and trains around cheap workers"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
lanectl = "lanectl.cli:main"
lanectl-model-gateway = "lanectl.resident_gateway:main"
lanectl-settlement-summary = "lanectl.settlement_summary:main"
lanectl-settlement-batch = "lanectl.settlement_batch:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
